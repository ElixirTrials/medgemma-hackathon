server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types and add .mjs for ES module support (pdf.js worker)
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Avoid console warning: do not send deprecated browsing-topics in Permissions-Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # SPA routing: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html (ensures latest build is served)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
